<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 30px;
        }
        .button {
            background-color: red;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            margin: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        .button:hover {
            background-color: darkred;
        }
        .game-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

    <h1>New Tab</h1>

    <div class="game-container">
        <button class="button" onclick="openGame('game1.html')">Game 1</button>
        <button class="button" onclick="openGame('game2.html')">Game 2</button>
        <button class="button" onclick="openGame('game3.html')">Game 3</button>
        <button class="button" onclick="openGame('game4.html')">Game 4</button>
        <button class="button" onclick="openGame('game5.html')">Game 5</button>
    </div>

    <button class="button" onclick="toggleFullscreen()">Fullscreen</button>

    <script>
        function openGame(game) {
            const iframe = document.createElement('iframe');
            iframe.src = game;
            iframe.style.width = '100%';
            iframe.style.height = '80vh';
            iframe.style.border = 'none';
            document.body.appendChild(iframe);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>

</body>
</html>
